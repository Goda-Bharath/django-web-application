<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Player</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0, 242, 255, 0.15),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );
        }

        .container {
            width: 100%;
            max-width: 520px;

            background: #111827;

            padding: 35px;

            border-radius: 20px;

            border: 1px solid rgba(0, 242, 255, 0.2);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4),
                0 0 25px rgba(0, 242, 255, 0.15);

            animation: fadeIn 0.6s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: rgba(0, 242, 255, 0.1);

            font-size: 28px;
        }

        h2 {
            color: #00f2ff;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #d1d5db;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            background: #1f2937;

            color: white;

            border: 1px solid #374151;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            transition: 0.25s ease;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            border-color: #00f2ff;

            box-shadow:
                0 0 0 3px rgba(0, 242, 255, 0.1);
        }

        input[type="file"] {
            padding: 9px;
            cursor: pointer;
        }

        .current-logo {
            margin-top: 10px;

            display: flex;
            align-items: center;
            gap: 12px;

            color: #94a3b8;

            font-size: 13px;
        }

        .current-logo img {
            width: 55px;
            height: 55px;

            object-fit: cover;

            border-radius: 10px;

            border: 1px solid #374151;
        }

        .button-group {
            display: flex;
            gap: 12px;

            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .update-btn {
            background: linear-gradient(
                135deg,
                #00f2ff,
                #00c6ff
            );

            color: #001014;
        }

        .update-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 242, 255, 0.25);
        }

        .back-btn {
            background: #374151;
            color: #e5e7eb;
        }

        .back-btn:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            .button-group {
                flex-direction: column;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="icon">
                👤
            </div>

            <h2>
                Update Player
            </h2>

            <p class="subtitle">
                Update registration details for {{ players.name }}
            </p>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Player Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter player name"
                    value="{{ players.name }}"
                    required
                >

            </div>

            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <input
                    type="text"
                    id="country"
                    name="country"
                    placeholder="Enter country"
                    value="{{ players.country }}"
                    required
                >

            </div>

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter age"
                    value="{{ players.age }}"
                    min="1"
                    max="100"
                    required
                >

            </div>

            <div class="form-group">

                <label for="logo_url">
                    Player Image / Logo
                </label>

                <input
                    type="file"
                    id="logo_url"
                    name="logo_url"
                    accept="image/*"
                >

                {% if players.logo_url %}
                    <div class="current-logo">

                        <img
                            src="{{ players.logo_url.url }}"
                            alt="{{ players.name }}"
                        >

                        <span>
                            Current image
                        </span>

                    </div>
                {% endif %}

            </div>


            <div class="form-group">

                <label for="role">
                    Role
                </label>

                <input
                    type="text"
                    id="role"
                    name="role"
                    placeholder="Enter player role"
                    value="{{ players.role }}"
                    required
                >

            </div>
            <div class="form-group">

                <label for="nationality">
                    Nationality
                </label>

                <input
                    type="text"
                    id="nationality"
                    name="nationality"
                    placeholder="Enter nationality"
                    value="{{ players.nationality }}"
                    required
                >

            </div>
            <div class="form-group">

                <label for="franchises">
                    Franchise
                </label>

                <input
                    type="text"
                    id="franchises"
                    name="franchises"
                    placeholder="Enter franchise"
                    value="{{ players.franchises }}"
                    required
                >

            </div>
            <div class="button-group">

                <a
                    href="{% url 'players_list' %}"
                    class="back-btn"
                >
                    ← Cancel
                </a>

                <button
                    type="submit"
                    class="update-btn"
                >
                    Update Player
                </button>

            </div>

        </form>

    </div>

</body>

</html>
