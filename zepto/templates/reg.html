<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your TripPilot account"
    >

    <title>Create Account | TripPilot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(34, 211, 238, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(99, 102, 241, 0.3),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #172554,
                    #0f172a
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

            color: white;
        }
  

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #4f46e5
                );

            box-shadow:
                0 10px 30px rgba(6, 182, 212, 0.3);
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #1376ef;
            font-size: 14px;
        }


        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #86efac;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;

            padding: 13px 15px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 12px;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.12);
        }

        .input-group input.error-input {
            border-color: #f87171;
        }


        .password-input {
            padding-right: 70px !important;
        }

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #22d3ee;

            font-size: 12px;

            cursor: pointer;

            width: auto;

            padding: 5px;
        }

        .show-password:hover {
            background: transparent;
        }


        .password-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 5px;

            background: #334155;

            border-radius: 10px;

            overflow: hidden;
        }

        .strength-fill {
            height: 100%;

            width: 0%;

            border-radius: 10px;

            transition: 0.3s;
        }

        .strength-text {
            display: block;

            margin-top: 5px;

            font-size: 12px;

            color: #94a3b8;
        }


        .register-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #4f46e5
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.25);
        }

        .register-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px rgba(79, 70, 229, 0.35);
        }

        .register-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .login-text {
            text-align: center;

            margin-top: 24px;

            color: #94a3b8;

            font-size: 14px;
        }

        .login-text a {
            color: #22d3ee;

            text-decoration: none;

            font-weight: 600;

            margin-left: 5px;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .register-container {
                padding: 25px 20px;

                border-radius: 20px;
            }

            .heading h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="register-container">
        <div class="logo">
            🚍
        </div>

        <div class="heading">

            <h1>Create Account</h1>

            <p>
                Join TripPilot and start your journey
            </p>

        </div>

        {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message
                    {% if message.tags %}
                        {{ message.tags }}
                    {% else %}
                        success
                    {% endif %}
                ">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

        {% endif %}



        <form
            method="post"
            id="registerForm"
            novalidate
        >

            {% csrf_token %}


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    minlength="3"
                >

            </div>


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        id="password"
                        class="password-input"
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="togglePassword"
                    >
                        Show
                    </button>

                </div>

                <div class="password-strength">

                    <div class="strength-bar">

                        <div
                            class="strength-fill"
                            id="strengthFill"
                        ></div>

                    </div>

                    <span
                        class="strength-text"
                        id="strengthText"
                    >
                        Password strength
                    </span>

                </div>

            </div>

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="register-button"
                id="registerButton"
            >
                Create Account
            </button>

        </form>

        <p class="login-text">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </p>

    </div>

</div>


<script>

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const togglePassword =
        document.getElementById("togglePassword");

    const strengthFill =
        document.getElementById("strengthFill");

    const strengthText =
        document.getElementById("strengthText");

    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");


    togglePassword.addEventListener(
        "click",
        function () {

            if (password.type === "password") {

                password.type = "text";

                togglePassword.textContent =
                    "Hide";

            } else {

                password.type = "password";

                togglePassword.textContent =
                    "Show";
            }

        }
    );


    password.addEventListener(
        "input",
        function () {

            const value = password.value;

            let strength = 0;

            if (value.length >= 6) {
                strength++;
            }

            if (/[A-Z]/.test(value)) {
                strength++;
            }

            if (/[0-9]/.test(value)) {
                strength++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                strength++;
            }


            if (strength === 0) {

                strengthFill.style.width = "0%";

                strengthText.textContent =
                    "Password strength";

            } else if (strength === 1) {

                strengthFill.style.width = "25%";

                strengthFill.style.background =
                    "#ef4444";

                strengthText.textContent =
                    "Weak password";

            } else if (strength === 2) {

                strengthFill.style.width = "50%";

                strengthFill.style.background =
                    "#f59e0b";

                strengthText.textContent =
                    "Medium password";

            } else if (strength === 3) {

                strengthFill.style.width = "75%";

                strengthFill.style.background =
                    "#22c55e";

                strengthText.textContent =
                    "Good password";

            } else {

                strengthFill.style.width = "100%";

                strengthFill.style.background =
                    "#16a34a";

                strengthText.textContent =
                    "Strong password";
            }

        }
    );

    confirmPassword.addEventListener(
        "input",
        function () {

            if (
                confirmPassword.value &&
                password.value !== confirmPassword.value
            ) {

                confirmPassword.classList.add(
                    "error-input"
                );

            } else {

                confirmPassword.classList.remove(
                    "error-input"
                );

            }

        }
    );


    registerForm.addEventListener(
        "submit",
        function (event) {

            const username =
                document.getElementById("username");

            const email =
                document.getElementById("email");


            if (username.value.trim().length < 3) {

                event.preventDefault();

                alert(
                    "Username must contain at least 3 characters."
                );

                username.focus();

                return;
            }


            if (!email.value.includes("@")) {

                event.preventDefault();

                alert(
                    "Please enter a valid email address."
                );

                email.focus();

                return;
            }


            if (password.value.length < 6) {

                event.preventDefault();

                alert(
                    "Password must contain at least 6 characters."
                );

                password.focus();

                return;
            }


            if (
                password.value !==
                confirmPassword.value
            ) {

                event.preventDefault();

                alert(
                    "Passwords do not matched."
                );

                confirmPassword.focus();

                return;
            }

            registerButton.disabled = true;

            registerButton.textContent =
                "Creating Account...";

        }
    );

</script>

</body>

</html>
