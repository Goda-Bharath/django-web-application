<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Update organization registration details">

    <title>Update Registration | {{ franchise.name }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b1120;
            --bg-secondary: #111827;
            --bg-input: #1f2937;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #22d3ee;
            --accent-dark: #06b6d4;
            --danger: #f87171;
            --radius: 12px;
        }

        body {
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(34, 211, 238, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(59, 130, 246, 0.10),
                    transparent 30%
                ),
                var(--bg-primary);
            color: var(--text-primary);
            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 36px;
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 22px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(34, 211, 238, 0.06);
            animation: fadeIn 0.45s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(34, 211, 238, 0.10);
            border: 1px solid rgba(34, 211, 238, 0.15);
            font-size: 25px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 27px;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .highlight {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
        }

        .required {
            color: var(--danger);
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:hover {
            border-color: #475569;
        }

        input:focus {
            border-color: var(--accent);
            background: #243244;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.10);
        }

        input[type="file"] {
            height: auto;
            padding: 10px 12px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            margin-right: 10px;
            padding: 7px 12px;
            border: 0;
            border-radius: 8px;
            background: #334155;
            color: #f8fafc;
            cursor: pointer;
        }

        .current-logo {
            margin-top: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.7);
        }

        .current-logo img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .current-logo span {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            border: 0;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent-dark)
            );
            color: #06202a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 211, 238, 0.20);
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .form-note {
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
                align-items: flex-start;
            }

            .container {
                margin-top: 20px;
                padding: 26px 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 23px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 22px 16px;
            }

            .header {
                margin-bottom: 25px;
            }

            .icon {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }

            input {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="icon" aria-hidden="true">✏️</div>

            <h1>
                Update <span class="highlight">Registration</span>
            </h1>

            <p class="subtitle">
                Update the registration details for
                <strong>{{ franchise.name }}</strong>
            </p>
        </header>

        <form
            method="POST"
            enctype="multipart/form-data"
            autocomplete="off"
        >

            {% csrf_token %}

            <div class="form-group">
                <label for="name">
                    Organization Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ franchise.name }}"
                    placeholder="Enter organization name"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="short_name">
                    Short Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="short_name"
                    name="short_name"
                    value="{{ franchise.short_name }}"
                    placeholder="Enter short name"
                    maxlength="50"
                    required
                >
            </div>

            <div class="form-group">
                <label for="founded_year">
                    Founded Year <span class="required">*</span>
                </label>

                <input
                    type="number"
                    id="founded_year"
                    name="founded_year"
                    value="{{ franchise.founded_year }}"
                    placeholder="YYYY"
                    min="1800"
                    max="2100"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="form-group">
                <label for="logo_url">
                    Organization Logo
                </label>

                <input
                    type="file"
                    id="logo_url"
                    name="logo_url"
                    accept="image/png,image/jpeg,image/webp"
                >

                {% if franchise.logo_url %}
                    <div class="current-logo">
                        <img
                            src="{{ franchise.logo_url.url }}"
                            alt="{{ franchise.name }} logo"
                        >

                        <span>
                            Current organization logo
                        </span>
                    </div>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="city">
                    City <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    value="{{ franchise.city }}"
                    placeholder="Enter city"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="state">
                    State <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    value="{{ franchise.state }}"
                    placeholder="Enter state"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="country">
                    Country <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="country"
                    name="country"
                    value="{{ franchise.country }}"
                    placeholder="Enter country"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-actions">

                <a
                    href="{% url 'franchise_lists' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Update Registration
                </button>

            </div>

            <p class="form-note">
                Fields marked with * are required.
            </p>

        </form>

    </main>

</body>
</html>
