<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 20px;
        }

        .success-box {
            width: 100%;
            max-width: 450px;
            background: #111827;
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.35);
            animation: fadeIn 0.7s ease;
        }

        .tick {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #00ff99;
            color: #111827;
            font-size: 45px;
            font-weight: bold;
            animation: pop 0.5s ease;
        }

        .success-box h2 {
            color: #00ff99;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .success-box p {
            color: #cbd5e1;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #00f2ff;
            color: #000;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #00ffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 500px) {
            .success-box {
                padding: 35px 25px;
            }

            .success-box h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="tick">
            ✓
        </div>

        <h2>Player Registered Successfully</h2>

        <p>
            Your player details have been successfully saved.
        </p>

        <a href="/register" class="btn">
            Register Another Player
        </a>

    </div>

</body>
</html>
