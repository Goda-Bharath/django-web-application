<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Stadium</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0, 242, 255, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );
        }

        .card-box {
            width: 100%;
            max-width: 550px;

            padding: 35px;

            background: rgba(17, 17, 17, 0.96);

            border: 1px solid rgba(0, 242, 255, 0.25);
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                0 0 25px rgba(0, 242, 255, 0.15);

            animation: fadeIn 0.6s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .stadium-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: rgba(0, 242, 255, 0.1);

            font-size: 32px;

            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
        }

        h3 {
            color: #00f2ff;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 0;
        }

        /* Crispy form labels */
        label {
            color: #d1d5db !important;
            font-weight: 500;
            margin-bottom: 7px;
        }

        /* Form controls */
        input,
        select,
        textarea {
            width: 100%;

            background: #1f2937 !important;
            color: #ffffff !important;

            border: 1px solid #374151 !important;
            border-radius: 10px !important;

            padding: 11px 13px !important;

            transition: 0.25s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background: #111827 !important;

            border-color: #00f2ff !important;

            box-shadow:
                0 0 0 3px rgba(0, 242, 255, 0.12) !important;

            outline: none !important;
        }

        input::placeholder,
        textarea::placeholder {
            color: #6b7280 !important;
        }

        /* Select dropdown */
        select option {
            background: #1f2937;
            color: white;
        }

        /* Help text */
        .form-text {
            color: #64748b !important;
            font-size: 12px;
        }

        /* Error messages */
        .invalid-feedback,
        .errorlist {
            color: #f87171 !important;
            font-size: 13px;
        }

        /* Submit button */
        .btn-custom {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #00f2ff,
                #00c6ff
            );

            color: #001014;

            font-weight: 700;
            font-size: 16px;

            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);

            background: linear-gradient(
                135deg,
                #00ffff,
                #00d4ff
            );

            box-shadow:
                0 8px 20px rgba(0, 242, 255, 0.25);
        }

        .btn-custom:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #00f2ff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {

            .card-box {
                padding: 25px 20px;
                border-radius: 16px;
            }

            h3 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    {% load crispy_forms_tags %}

    <main class="card-box">

        <!-- Header -->
        <div class="header">

            <div class="stadium-icon">
                🏟️
            </div>

            <h3>
                Register Stadium
            </h3>

            <p class="subtitle">
                Add a new stadium to your system
            </p>

        </div>


        <!-- Form -->
        <form method="POST" novalidate>

            {% csrf_token %}

            {{ form|crispy }}

            <button
                type="submit"
                class="btn btn-custom mt-3"
            >
                Register Stadium
            </button>

        </form>

        <a
            href="{% url 'stadium_list' %}"
            class="back-link"
        >
            ← Back to Stadiums
        </a>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
